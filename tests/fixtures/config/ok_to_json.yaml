# Convert an .OK file into a Calgary JSON file (TEST DATA generation).
#
# The two formats carry the same orders from DIFFERENT source systems (legacy
# .OK vs the new system's JSON), so this is not a lossless re-encoding: the JSON
# has fields the .OK never had. Conversion therefore starts from a REAL vendor
# sample as a TEMPLATE and overwrites only what the .OK can actually supply.
# Anything not listed below keeps its template value, so an incomplete mapping
# degrades to "looks like a real vendor file", never to a blank where data
# should be.
#
# Output lands in a NEW folder whose name carries the `source` token below, so
# the existing SCAN/WMS resolution (json_sources.yaml) picks it up with no extra
# mechanism — which is what makes `keytrol` the unique key for these files.
#
# Paths are relative to THIS config directory. Restart OkGen after editing.
#
# Per-field rules:
#   from:       the .OK field name to read
#   transform:  see the list at the bottom (default: trim trailing/leading pad)
#   raw:        true = take the .OK value verbatim, padding and all

conversions:

  StyleHeader:
    target: CalgaryStyleHeader
    template: templates/CalgaryStyleHeader.json
    source: SCAN                 # names the output folder -> key is `keytrol`
    key: keytrol                 # kept unique across the batch

    # --- data.header -------------------------------------------------------
    header:
      chain:          { from: chain }
      format:         { from: format }
      keytrol:        { from: keytrol }
      headerSuffix:   { from: suffix }
      sequenceCode:   { from: seq_code }
      packId:         { from: pack_id }
      style:          { from: style }
      laneRecords:    { from: lane_rec }
      department:     { from: dept }
      transmitDate:   { from: date, transform: iso_date }
      version:        { from: version }
      price:          { from: comp_price, transform: implied_2dp }
      area:           { from: area }
      instructions:   { from: instructions }
      vendorStyle:    { from: ven_style }
      description:    { from: desc }
      category:       { from: category }          # 3 OR 4 digits — never padded
      totalQuantity:  { from: tot_qty, transform: strip_zeros }
      retailPrice:    { from: ret_price, transform: implied_2dp }
      # A converted file's source is decided by this field, exactly like any
      # other Calgary JSON: it is taken from the .OK when that layout has an
      # ASN field, and is NULL when it does not. None of the three convertible
      # layouts has one, so every converted file is a SCAN file — which is what
      # makes `keytrol` its key rather than a borrowed ASN from the template.
      headerASNid:    { from: header_asn_id, null_when_blank: true }
      # Not listed -> template value. Notably purchaseOrderNumber (no .OK source).

    # --- nested arrays on the header --------------------------------------
    # An .OK section with no real rows leaves the template's single blank
    # placeholder row alone — every vendor sample has exactly one, never [].
    arrays:
      lanes:
        section: Lane
        fields:
          lane:     { from: lane1 }
      sizes:
        section: Size
        fields:
          size:     { from: size, transform: blank_to_null }
          quantity: { from: qty, transform: strip_zeros }
      # A StyleHeader .OK has NO store section, so the template placeholder row
      # stands — but these three must read as present-and-empty (JSON null)
      # rather than carry values borrowed from an unrelated order.
      stores:
        section: Store                    # not present on this layout
        null_when_blank: [puertoRicoFlag, cartonSequence, qtyToPrint]

    # --- row counts --------------------------------------------------------
    # Computed from the rows actually emitted, NOT copied from the .OK header,
    # which can be stale. Only written when the rows really came from the .OK —
    # `stores` here is a template placeholder, so its counts are left alone.
    # `lanes`/`sizes` counts are deliberately NOT listed (user's call for now).
    # `lineCount` is deliberately NOT computed — the user's call: conversion
    # must not touch it when the .OK carries data, so it keeps the template's
    # value. Only the empty form below is written, and only when there are no
    # details to count.
    counts: {}

    # What a count field says when its array carries no real .OK rows — whether
    # the section was emptied, or the .OK layout has no such section at all.
    # Written VERBATIM, so `null` is a JSON null and `" "` is a single space.
    # Declared per layout because the three do not agree, and because a count
    # that claims rows a file does not have is the failure D46 exists to stop.
    #
    # A StyleHeader has no store section, so these two are always the empty
    # form; they are declared rather than inherited so the value is visible
    # here rather than dependent on whatever the template happens to carry.
    empty_counts:
      laneRecords:    { array: lanes,   value: null }
      numberOfStores: { array: stores,  value: " " }
      storeLines:     { array: stores,  value: " " }
      lineCount:      { array: details, value: " " }

    # --- data.details[] ----------------------------------------------------
    # The reshape: an .OK StyleHeader has NO detail rows, but the JSON needs
    # one — and its fields live on the .OK HEADER.
    details:
      from_section: Header
      fields:
        style:               { from: style }
        type:                { from: type }
        # item/fact1-3 show as null when the .OK carries nothing for them,
        # rather than inheriting the template's text.
        item:                { from: item, null_when_blank: true }
        fact1:               { from: fact1, null_when_blank: true }
        fact2:               { from: fact2, null_when_blank: true }
        fact3:               { from: fact3, null_when_blank: true }
        pastSeasonIndicator: { from: psi, raw: true }
        messageCode1:        { from: message1 }
        messageCode2:        { from: message2 }
        compareAtPrice:      { from: comp_price, transform: pad9 }
        compareAtUp:         { from: comp_up, transform: yn_to_bool }
        retailPrice:         { from: ret_price, transform: pad9 }
        quantity:            { from: tot_qty, raw: true }
        pieces:              { from: pieces, raw: true }
        ladderPlanMMYY:      { from: ladder_mmdd }
        ladderPlan:          { from: ladder_mmdd, transform: mmyy_to_first_of_month }
        category:            { from: category }

  DistLabels:
    target: CalgaryDistLabel
    template: templates/CalgaryDistLabel.json
    source: SCAN
    key: keytrol

    # --- data.header -------------------------------------------------------
    header:
      chain:          { from: chain }
      format:         { from: format }
      keytrol:        { from: keytrol }
      headerSuffix:   { from: hsuffix }
      style:          { from: style }
      department:     { from: dept }
      transmitDate:   { from: date, transform: iso_date }
      distroDate:     { from: date }              # raw 8-digit, as the samples carry it
      houseNumber:    { from: housenum }
      description:    { from: desc }
      area:           { from: area }
      # Decimal form with the dot ('001699' -> '16.99'), same as styleHeaders,
      # and HEADER-ONLY: distributionLabels have no store- or detail-level
      # retailPrice. (User-confirmed against the live system — the sample files
      # in hand still carry the older un-dotted '999999' form.)
      retailPrice:    { from: price, transform: implied_2dp }
      # A converted file's source is decided by this field, exactly like any
      # other Calgary JSON: it is taken from the .OK when that layout has an
      # ASN field, and is NULL when it does not. None of the three convertible
      # layouts has one, so every converted file is a SCAN file — which is what
      # makes `keytrol` its key rather than a borrowed ASN from the template.
      headerASNid:    { from: header_asn_id, null_when_blank: true }

    # Counted from the rows actually emitted (lanes/sizes excluded on purpose).
    # `storeLines` is NOT computed (user's call) — untouched while the .OK has
    # data, so it keeps the template's value; only its empty form is written.
    counts:
      numberOfStores: stores

    # See CalgaryStyleHeader's block above for what this is. `lanes` is null on
    # this layout, so `laneRecords` resolves to the empty form either way — it
    # is declared so the answer comes from config rather than from the template.
    empty_counts:
      laneRecords:    { array: lanes,   value: null }
      numberOfStores: { array: stores,  value: "" }
      storeLines:     { array: stores,  value: null }
      lineCount:      { array: details, value: null }

    # --- nested arrays -----------------------------------------------------
    # distributionLabels carry `lanes`/`sizes` as null (not [{}]), so they are
    # not declared here and keep the template's null.
    arrays:
      stores:
        section: Store
        # Present-but-empty rather than template-inherited. puertoRicoFlag,
        # cartonSequence and qtyToPrint all DO come from the .OK here, so each
        # reads as null only when its own .OK value is blank.
        null_when_blank: [puertoRicoFlag, cartonSequence, qtyToPrint]
        fields:
          store:          { from: store, transform: pad_left_4 }
          puertoRicoFlag: { from: prflag }
          units:          { from: units, transform: strip_zeros }
          distroType:     { from: distr_type }
          # The .OK store quantity feeds BOTH storeQuantity and qtyToPrint.
          storeQuantity:  { from: store_qty, transform: strip_zeros }
          qtyToPrint:     { from: store_qty, transform: strip_zeros }
          cartonSequence: { from: cartseq }
          adDate:         { from: ad }
          # `date` has no .OK source -> template value.

    # No `details:` block — every distributionLabels sample carries an EMPTY
    # details[], unlike styleHeaders where it is built from the .OK header.
    #
    # Unmapped on purpose: the .OK `seq` field (the spec says sequence is
    # "calculated on our end") and the whole TSticker section (no JSON target,
    # and no sample data exists for it — see PLAN §6).

  CartonLabel:
    target: CalgaryCartonLabel
    template: templates/CalgaryCartonLabel.json
    source: SCAN
    # NB not keytrol: a carton label is identified by pickListId, and it is the
    # SAME field for SCAN and WMS (see keys.yaml).
    key: pickListId

    # --- data.header -------------------------------------------------------
    header:
      chain:            { from: chain }
      format:           { from: format }
      keytrol:          { from: keytrol }
      headerSuffix:     { from: suffix }
      style:            { from: style }
      department:       { from: dept }
      # A CartonLabel .OK has no `date` field; the samples carry transmitDate as
      # the ISO form of the distro date, and distroDate as its raw 8 digits.
      transmitDate:     { from: distro_date, transform: iso_date }
      distroDate:       { from: distro_date }
      pickListPrefix:   { from: picklist_pre }
      pickListId:       { from: picklist_id }
      pickListSequence: { from: picklist_seq }
      numberOfpacks:    { from: num_packs, transform: strip_zeros }   # lowercase p
      aisle:            { from: aisle }
      slot:             { from: slot }
      tier:             { from: tier }
      # locator and lpn are the SAME value in every sample, and the .OK carries
      # only `locator` — so when it is blank BOTH read as null rather than
      # inheriting the template's locator (another order's bin/LPN).
      locator:          { from: locator, null_when_blank: true }
      lpn:              { from: locator, null_when_blank: true }
      packSize:         { from: packsize, transform: strip_zeros }
      markdown:         { from: markdown }
      distroType:       { from: distro_type }
      adDate:           { from: ad_date }
      packType:         { from: pack_type }
      nested:           { from: nested }
      partial:          { from: partial }
      suppress:         { from: suppress }
      coordinateIndicator: { from: coord }
      houseNumber:      { from: house }
      retailPrice:      { from: ret_price, transform: implied_2dp, null_when_blank: true }
      # A converted file's source is decided by this field, exactly like any
      # other Calgary JSON: it is taken from the .OK when that layout has an
      # ASN field, and is NULL when it does not. None of the three convertible
      # layouts has one, so every converted file is a SCAN file — which is what
      # makes `keytrol` its key rather than a borrowed ASN from the template.
      headerASNid:    { from: header_asn_id, null_when_blank: true }
      # purchaseOrderNumber has no .OK source -> template value.
      # numberOfStores is NOT mapped from the .OK header: it declares 38 while
      # the file carries 91 store rows. It is counted below instead.

    # `storeLines` is NOT computed (user's call) — untouched while the .OK has
    # data, so it keeps the template's value; only its empty form is written.
    counts:
      numberOfStores: stores

    # See CalgaryStyleHeader's block above for what this is. `lanes` is null on
    # this layout, so `laneRecords` resolves to the empty form either way — it
    # is declared so the answer comes from config rather than from the template.
    empty_counts:
      laneRecords:    { array: lanes,   value: null }
      numberOfStores: { array: stores,  value: "" }
      storeLines:     { array: stores,  value: null }
      lineCount:      { array: details, value: null }

    # --- nested arrays -----------------------------------------------------
    # Same shape as distributionLabels: lanes/sizes are null and details[] is
    # empty, so neither is declared.
    arrays:
      stores:
        section: store                  # lower-case section name on this layout
        null_when_blank: [puertoRicoFlag, cartonSequence, qtyToPrint]
        fields:
          store:          { from: store, transform: pad_left_4 }
          puertoRicoFlag: { from: prflag }
          numberOfPacks:  { from: dnum_packs, transform: strip_zeros }
          # storeQuantity mirrors numberOfPacks in every sample.
          storeQuantity:  { from: dnum_packs, transform: strip_zeros }
          cartonSequence: { from: cart_seq }
          adDate:         { from: dad_date }
          suppress:       { from: dsuppress }
          # units / distroType / date / puertoRicoStore* have no .OK source.

    # Unmapped on purpose: the .OK `sequence` field — the vendor spec says
    # Sequence is "calculated by GTA".

# Available transforms (okgen/okjson.py):
#   trim                    default — strip surrounding pad
#   raw                     verbatim, padding kept (use `raw: true`)
#   strip_zeros             '0000022' -> '22'   ('000' -> '0')
#   implied_2dp             '002099'  -> '20.99'
#   pad9                    '002099'  -> '000002099'
#   pad_left_4              '208'     -> '0208'   (store numbers)
#   iso_date                '20170717'-> '2017-07-17'
#   mmyy_to_first_of_month  '0817'    -> '20170801'
#   yn_to_bool              'Y'/'N'   -> 'true'/'false'
#   blank_to_null           ''        -> null

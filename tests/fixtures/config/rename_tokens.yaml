# Fixed rename-token palette for tests.
rename_tokens:
  custom:
    # Label tokens: fixed strings that INTRODUCE the value glued after them.
    # `_build_name` needs to know which tokens are labels to decide that a
    # label whose value is empty should be dropped with it, so the fixture
    # carries more than one of them.
    FMT: "FMT"
    KEY: "K"
    CP: "CP"

  # ---- filename length limits (token -> keep only the LAST n characters) ----
  # Applied ONLY when a name is built; the field's real value is untouched.
  # The LAST n, not the first: these are zero-PADDED values — a Calgary price
  # is 6 significant digits in a 9-wide field — so trimming from the front
  # would keep the padding and discard the number (`000799999` -> `000799`
  # rather than `799999`).
  keep_last:
    Details.compareAtPrice: 6
    Details.retailPrice: 6
    compareAtPrice: 6
    retailPrice: 6
  derived:
    - sl
    - brand
    - brand_short
    - format_label
    - layout
    - layout_short
    - key
    - seq
    - orig
  header_fields:
    - department
    - headerSuffix
    - compareAtPrice
    - compareAtUp
    - retailPrice
    - headerASNid
    - chain
    - format
    - type
    - keytrol
    - po
    - vendor_style
    - picklist_id
    - size_rec
    - lane_rec
    # EU/EWMS GTA fields
    - process
    - distribution_type
    - pack_type
    - zone_retail
    - zone_compare_at

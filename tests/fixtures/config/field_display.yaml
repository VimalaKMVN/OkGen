# Per-layout editor-field display rules.
#
#   hidden    field names never shown in the section editor — structural /
#             marker tokens the user doesn't need to see (the leading-'|'
#             placeholder, the '#'/'&' record-type chars). The bytes are still
#             parsed and preserved on save; this only hides them from the form.
#
#   readonly  field names shown but NOT editable — rendered as a static label.
#             A coded value uses its display.yaml label (e.g. format H ->
#             "CartonLabels"), so the user sees the friendly value locked.
#
#   layout name -> [output_field_name, ...]
hidden:
  EUStyleHeader: [marker, detail_marker, lane_marker]
  EUCartonLabel: [marker, detail_marker]

readonly:
  # Layout DETECTION SIGNATURES — locked in the editor AND in bulk, because
  # changing one makes the saved file unopenable or silently detect as another
  # layout. Mirrors config/field_display.yaml; service._assert_layout_stable is
  # the backstop if this list drifts.
  StyleHeader: [indicator]
  Preticket: [indicator]
  DistLabels: [format]
  CartonLabel: [picklist_pre]
  EUPreticket: [indicator]
  EUStyleHeader: [process]
  EUCartonLabel: [process]

# Fields stored EXACTLY as the user typed them: never zero-padded, never
# re-justified, leading/middle/trailing spaces preserved. Only the leftover
# space at the END is filled (with spaces) — the record must keep its exact
# length or every field after it shifts. The field width is still enforced:
# a value longer than the field is rejected, not truncated.
#
# Why this list: these are free-text fields (messages, facts, descriptions,
# sizes, weights, areas). OkGen otherwise GUESSES the padding style from the
# layout's sample value, which misreads a sample like '01        ' as a
# zero-padded number — typing 'AB' into EUPreticket message1 stored
# '00000000AB'. Codes stay out of this list: `dept` remains zero-padded, so 7
# is still stored as 07.
#
#   "*" applies to every layout; add a layout name for a narrower rule.
literal:
  "*":
    - message1
    - message2
    - instructions
    - fact1
    - fact2
    - fact3
    - item
    - universal_item
    - description
    - area
    - size
    - size_code
    - size_1
    - size_2
    - size_3
    - size_4
    - size_5
    - size_6
    - size_7
    - size_8
    - size_9
    - size_10
    - phys_size_1
    - phys_size_2
    - phys_size_3
    - phys_size_4
    - phys_size_5
    - phys_size_6
    - phys_size_7
    - phys_size_8
    - phys_size_9
    - phys_size_10
    - upp_weight
    - header_asn_id
    # Not present in any current layout, listed so they behave correctly the
    # day they appear (Calgary JSON or a spec revision):
    - total_weight
    - vendor_style
    - fiber
    - approx_size
    - country

# Mirrors production: JSON store numbers are zero-padded to the field's size.
pad_zeros:
  CalgaryStyleHeader:
    - store
  CalgaryDistLabel:
    - store
  CalgaryCartonLabel:
    - store

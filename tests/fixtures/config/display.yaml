# Fixed display rules for tests. Stable on purpose so tests don't depend on
# the editable repo config/display.yaml.
rules:
  - match: {field: indicator}
    values: {Y: "Yes", N: "No"}

  - match: {layout: StyleHeader, field: format}
    values: {A: "Format A", B: "Format B"}

  - match: {chain: "03", layout: StyleHeader, format: A, field: format}
    values: {A: "Regular Tag (Homegoods)"}

  # list-matching coverage
  - match: {chain: ["03", "04"], layout: [StyleHeader, Preticket], field: type}
    values: {"1": "Type One", "2": "Type Two"}


  # Calgary JSON has TWO `type` fields — the document kind on the Header, and
  # a coded 1-9 type on each detail row. Scoped by section so each gets its
  # own labels. Mirrors production display.yaml.
  # ONE word per layout: `type` is editable in its CAPITALISATION only, never
  # to another layout's word. `_assert_layout_stable` enforces it.
  - match: {layout: CalgaryStyleHeader, section: Header, field: type}
    values: {styleHeaders: "styleHeaders"}
  - match: {layout: CalgaryCartonLabel, section: Header, field: type}
    values: {cartonLabels: "cartonLabels"}
  - match: {layout: CalgaryDistLabel, section: Header, field: type}
    values: {distributionLabels: "distributionLabels"}

  # Calgary chain by CODE or by NAME (D41 — the samples carry both). Scoped to
  # the Calgary layouts so the .OK layouts keep the code-only chain registry.
  - match:
      layout: [CalgaryStyleHeader, CalgaryCartonLabel, CalgaryDistLabel]
      section: Header
      field: chain
    values:
      "01": "TJMAXX"
      "02": "Marshalls"
      "03": "Homegoods"
      "04": "Winners"
      "05": "Europe"
      "06": "HomeSense"
      "TJMAXX": "TJMAXX"
      "Marshalls": "Marshalls"
      "Homegoods": "Homegoods"
      "Winners": "Winners"
      "Europe": "Europe"
      "HomeSense": "HomeSense"

  # Keys QUOTED deliberately: YAML 1.1 reads bare true/false/Yes/No/Y/N as
  # booleans. Blank is a real allowed value, not the same thing as "false".
  - match: {layout: CalgaryStyleHeader, section: Details, field: compareAtUp}
    values:
      "": "(blank)"
      "true": "true"
      "false": "false"
      "Yes": "Yes"
      "No": "No"
      "Y": "Y"
      "N": "N"
  # ...and the DETAIL row's coded type, which must resolve independently of the
  # header rule above. In production this comes from the generic `field: type`
  # rule; pinned explicitly here so section scoping is proven in both directions.
  - match: {layout: CalgaryStyleHeader, section: Details, field: type}
    values: {"1": "Detail Type 1", "2": "Detail Type 2"}

  # EU GTA: the read-only `process` field is labeled by layout name.
  - match: {layout: [EUStyleHeader, EUCartonLabel], field: process}
    values: {D: "(D) StyleHeader", H: "(H) Holdings/CartonLabels"}

# Saved rename patterns. Pick a preset in the Bulk Rename panel to fill in ALL
# the parts at once (then tweak if you like) instead of adding parts one by one.
#
# Each preset has:
#   name       -> shown in the preset dropdown
#   separator  -> how the parts are joined ("_", "-", ".", "" for none)
#   parts      -> ordered list. Each entry is one of:
#                   * a TOKEN NAME  (a custom token from rename_tokens.yaml,
#                                    a derived token, or a header field)
#                   * {text: "..."} for inline literal text
#                   * no_delim      a "glue" marker: the parts on either side
#                                   join with NO separator (everything else
#                                   still uses `separator`). {glue: true} works too.
#
# HOUSE STYLE for every preset below, so they stay consistent:
#
#   1. `sl` first        — 01, 02, 03 …, padded to the size of the batch.
#   2. `brand_short`     — the tree badge text (HG, TJM, WN, EU, HS).
#   3. `layout_short`    — SH / PT / CL / DL.
#   4. A LABEL is GLUED to its own value: FMTA, T2, D78, CP000000, UPN,
#      RP002099. The label and the value are one thing, and a separator
#      between them was pure length.
#      THE KEY IS THE EXCEPTION: `K_550000P1A`, with an underscore. A key can
#      be long and unpunctuated — a Calgary WMS key is a 17-character ASN
#      (`KS403821608940739A`) — and glued to its label the run has no visible
#      start, so the separator earns its character there. Anything glued AFTER
#      the key (suffix, hsuffix, picklist_seq) stays glued: those are part of
#      the key, not a new field.
#   5. Order of the labelled pairs: FMT, T, K, D, CP, UP, RP — the ticket
#      format, then what kind of ticket, then WHICH order it is, then the
#      merchandising values.
#   6. The key is the `key` TOKEN, never the field name behind it. `key`
#      resolves each file's OWN unique field (keytrol / po / picklist_id, and
#      SCAN-vs-WMS on the Calgary layouts), so a preset applied to a folder of
#      mixed layouts still names every file's key. Naming the field directly
#      wrote no key at all on any layout keyed by a different one, and the
#      segment vanished silently — 24 of the 49 preset x layout combinations.
#
# The `.OK` and Calgary JSON presets differ ONLY in field names (`dept` vs
# `department`, `comp_price` vs `compareAtPrice`, …) — the shape is the same,
# so a file renamed from either engine reads the same way.
presets:
#  - name: "Brand · Layout · Key"
#    separator: "_"
#    parts: [brand, layout, key]
#
#  # Glue example: FMT joins directly to the format value, the rest use "_".
#  #   -> 01_HG_FMTA_550000.OK
#  - name: "FMT glued to format"
#    separator: "_"
#    parts: [sl, brand_short, FMT, no_delim, format, keytrol]

  # -------------------------------------------------------------- .OK files

  # 01_HG_SH_FMTA_T2_K550000P1A_D78_CP000000_UPN_RP002099.OK
  - name: "Styleheader naming convension"
    separator: "_"
    parts:
      - sl             # 01, 02, 03 … (padded to the batch size)
      - brand_short    # HG  (the tree badge text)
      - layout_short   # SH
      - FMT
      - no_delim
      - format         #   A
      - T
      - no_delim
      - type           #   2
      - KEY            # label "K"
      - key            #   550000 — the LAYOUT'S OWN key field (keytrol here),
                       #   not the field named directly: a preset naming
                       #   `keytrol` writes no key at all on a layout keyed by
                       #   `po`, and the segment vanishes silently
      - no_delim
      - suffix         #   P1A  (part of the key, so it stays glued on)
      - DEPT           # label "D"
      - no_delim
      - dept           #   78
      - CP
      - no_delim
      - comp_price     #   000000
      - CU             # label "UP"
      - no_delim
      - comp_up        #   N
      - RP
      - no_delim
      - ret_price      #   002099

  # 01_TJM_PT_FMTA_T3_K33001P3A_D06_CP999999_UPY_RP599999.OK
  - name: "Preticket naming convension"
    separator: "_"
    parts:
      - sl
      - brand_short
      - layout_short   # PT
      - FMT
      - no_delim
      - format
      - T
      - no_delim
      - type
      - KEY
      - key            # the layout's own key field (po here)
      - DEPT
      - no_delim
      - dept
      - CP
      - no_delim
      - comp_price
      - CU
      - no_delim
      - comp_up
      - RP
      - no_delim
      - ret_price

  # 01_TJM_CL_FMT1_KC001440002.OK
  - name: "Carton Label naming convension"
    separator: "_"
    parts:
      - sl
      - brand_short
      - layout_short   # CL
      - FMT
      - no_delim
      - format
      - KEY
      - C              # the "C:" picklist marker
      - no_delim
      - key            # the layout's own key field (picklist_id here)
      - no_delim
      - picklist_seq

  # 01_TJM_DL_FMT7_K550034AAA.OK
  - name: "Distribution Label naming convension"
    separator: "_"
    parts:
      - sl
      - brand_short
      - layout_short   # DL
      - FMT
      - no_delim
      - format
      - KEY
      - key            # the layout's own key field (keytrol here)
      - no_delim
      - hsuffix

  # --------------------------------------------------- EU / EWMS pipe files

  # 01_EU_PT_FMTA_Reg2_Z10_T1_K10021888_D87_CP003500_UPN_RP999998.OK
  # (key = po; region from regions.yaml via zone; type/comp_price/comp_up/
  #  ret_price come from the detail line)
  - name: "EUPreticket naming convension"
    separator: "_"
    parts:
      - sl
      - brand_short    # EU
      - layout_short   # PT — the EU layouts share the NA codes; the badge
                       #      already says EU, so `EPT` would only repeat it
      - FMT
      - no_delim
      - format
      - region         #   Reg1/Reg2 mapped from zone
      - Z
      - no_delim
      - zone           #   10
      - T
      - no_delim
      - type
      - KEY
      - key            # the layout's own key field (po here)
      - DEPT
      - no_delim
      - dept
      - CP
      - no_delim
      - comp_price
      - CU
      - no_delim
      - comp_up
      - RP
      - no_delim
      - ret_price

  # 01_EU_SH_FMTQ_T1_K126539Q_D42_CP_RP599.OK
  - name: "EUStyle Header naming convension"
    separator: "_"
    parts:
      - sl
      - brand_short
      - layout_short   # SH
      - FMT
      - no_delim
      - format
      - T
      - no_delim
      - type
      - KEY
      - key            # the layout's own key field (keytrol here)
      - DEPT
      - no_delim
      - dept
      - CP
      - no_delim
      - zone_compare_at
      - RP
      - no_delim
      - zone_retail

  # 01_EU_CL_FMT1_T7_K_8881333_D89_CP9300_RP5999.OK
  #
  # `format_code`, not `format`. On this layout `format` is a DERIVED field
  # (derived_fields.yaml) whose value is a DISPLAY string — "1 - Carton Label",
  # "2 - AD Carton Label", "4 - Masterpack", "5 - AD Masterpack" — which the
  # editor shows and TOSCA matches against a workbook Key column, so the field
  # itself must keep the wording. A filename wants the code: unsplit it
  # sanitised to `FMT1_-_Carton_Label`, 17 characters where every other layout
  # contributes one.
  - name: "EUCartonLabel naming convension"
    separator: "_"
    parts:
      - sl
      - brand_short
      - layout_short   # CL
      - FMT
      - no_delim
      - format_code    #   1 / 2 / 4 / 5 — the code, not "1 - Carton Label"
      - T
      - no_delim
      - type
      - KEY
      - key            # the layout's own key field (keytrol here)
      - DEPT
      - no_delim
      - dept
      - CP
      - no_delim
      - zone_compare_at
      - RP
      - no_delim
      - zone_retail

  # ----------------------------------------------- Calgary JSON (json_mode)
  #
  # Same shape as the `.OK` presets above; only the FIELD NAMES differ, because
  # the Calgary layouts spell them out (`department`, not `dept`). Using the
  # `.OK` presets on a JSON file leaves those segments BLANK while the labels
  # survive, which reads as `…_D_CP_UP_RP.json` — the D43 empty-segment
  # failure — so these exist rather than being a nicety.
  #
  # `type` is written SECTION-QUALIFIED here. On a Calgary file the header
  # `type` is the DOCUMENT discriminator (`styleHeaders`) and it shadows the
  # ticket type digit of the same name on the detail row — a bare `type` would
  # put the word `styleHeaders` into every filename. `Details.type` names the
  # section it reads from and resolves to the digit. Nine field names are
  # shadowed this way on a Calgary StyleHeader; `.OK` layouts have none, which
  # is why only these presets need the qualified form.

  # 01_WN_SH_FMTS_T2_KS403821608940739A_D92_CP000999999_UPtrue_RP7999.99.json
  - name: "Calgary StyleHeader (JSON)"
    separator: "_"
    parts:
      - sl
      - brand_short
      - layout_short   # SH
      - FMT
      - no_delim
      - format
      - T
      - no_delim
      - Details.type   #   2  — NOT the header `type`, which is the document
                       #        discriminator (`styleHeaders`) and shadows it
      - KEY
      - key            # source-aware: keytrol on SCAN, headerASNid on WMS
      - DEPT
      - no_delim
      - department
      - CP
      - no_delim
      - Details.compareAtPrice   # 999999 — last 6 of 000999999 (keep_last)
      - CU
      - no_delim
      - compareAtUp
      - RP
      - no_delim
      - Details.retailPrice      # 799999 — the DETAIL line's price, not the
                                 # header's. A bare `retailPrice` resolves to
                                 # the HEADER field, which shadows it (D70) and
                                 # carries a different form: `7999.99` dotted
                                 # against the detail's zero-padded `000799999`.

  # 01_MAR_PT_FMTB_T2_K40644701_D02_CP1999_UPY_RP799.json
  # The Style Header preset's exact shape — a Pre-Ticket has the same Details
  # section and the same nine shadowed field names, so `type`, `compareAtPrice`
  # and `retailPrice` all need the SECTION-QUALIFIED form for the same reason.
  # `key` resolves to purchaseOrderNumber here whichever source the folder is.
  - name: "Calgary Preticket (JSON)"
    separator: "_"
    parts:
      - sl
      - brand_short
      - layout_short   # PT
      - FMT
      - no_delim
      - format
      - T
      - no_delim
      - Details.type   #   2  — NOT the header `type` (`preTickets`)
      - KEY
      - key            # purchaseOrderNumber, SCAN or WMS alike
      - DEPT
      - no_delim
      - department
      - CP
      - no_delim
      - Details.compareAtPrice
      - CU
      - no_delim
      - compareAtUp
      - RP
      - no_delim
      - Details.retailPrice

  # 01_HS_DL_FMT7_KJ000827498941044J_D92.json
  # No `T` pair: CalgaryDistLabel has no Details section, so there is no ticket
  # type to name — its only sections are Header and Stores.
  - name: "Calgary DistLabel (JSON)"
    separator: "_"
    parts:
      - sl
      - brand_short
      - layout_short   # DL
      - FMT
      - no_delim
      - format
      - KEY
      - key
      - DEPT
      - no_delim
      - department

  # 01_WN_CL_FMT1_K10000_D87.json
  # Key is pickListId either way — CalgaryCartonLabel is not source-dependent.
  # No `T` pair, for the same reason as DistLabel: no Details section.
  - name: "Calgary CartonLabel (JSON)"
    separator: "_"
    parts:
      - sl
      - brand_short
      - layout_short   # CL
      - FMT
      - no_delim
      - format
      - KEY
      - key
      - DEPT
      - no_delim
      - department

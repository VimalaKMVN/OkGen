# The field that must be UNIQUE within a folder among files of each layout.
# Values are treated as zero-padded numbers. Editable.
#
#   layout name -> field name (output_field_name)
unique_fields:
  CartonLabel: picklist_id
  DistLabels: keytrol
  Preticket: po
  StyleHeader: keytrol
  EUPreticket: po
  EUStyleHeader: keytrol
  EUCartonLabel: keytrol
  # Calgary JSON layouts arrive from two sources — SCAN and WMS — with
  # identical structure but a different identity field. Which one applies is
  # resolved per folder from the file/folder name (see json_sources.yaml).
  # CartonLabel uses pickListId either way, so its source doesn't matter.
  CalgaryStyleHeader:
    SCAN: keytrol
    WMS: headerASNid
  CalgaryDistLabel:
    SCAN: keytrol
    WMS: headerASNid
  CalgaryCartonLabel:
    SCAN: pickListId
    WMS: pickListId

# Tokens offered in the Bulk Rename builder. Remove any line you don't want to
# appear as an option (to cut noise). A header-field token only shows when it
# exists in the selected files' layout(s).
#
# If this whole file is deleted, ALL tokens are shown.
#
# Three groups: `derived` are computed tokens; `header_fields` are raw header
# values; `custom` are reusable literal strings you define. Trim any to taste.
# (You can also add one-off literal text directly in the builder via a Text
# part — `custom` here is just for ones you want to reuse.)
rename_tokens:

  # ---- custom tokens (reusable literal strings: name -> text inserted) ----
  # Use them in the builder like any other token, as many times / anywhere you
  # like. Example: a token "FMT" that inserts "FMT" so you can build FMT_A.
  custom:
    FMT: "FMT"
    KEY: "K"
    DEPT: "D"
    CP: "CP"
    CU: "UP"
    RP: "RP"
    T: "T"
    C: "C"
    Z: "Z"
    # PROD: "PROD"
    # REPRINT: "RP"

  # ---- filename length limits (token -> keep only the LAST n characters) ----
  # Applied ONLY when a name is built; the field's real value is untouched.
  # The LAST n, not the first: these are zero-PADDED values — a Calgary price
  # is 6 significant digits in a 9-wide field — so trimming from the front
  # would keep the padding and discard the number (`000799999` -> `000799`
  # rather than `799999`).
  keep_last:
    Details.compareAtPrice: 6
    Details.retailPrice: 6
    compareAtPrice: 6
    retailPrice: 6

  # ---- derived (computed) tokens ----
  derived:
    - sl             # serial for THIS batch: 01, 02, 03 ... (see below)
    - brand          # chain name from chains.yaml (e.g. Homegoods)
    - brand_short    # the tree BADGE text (HG, TJM, WN, EU, HS) — chains.yaml `short`
    - layout_short   # short layout code (SH / PT / CL / DL) — layout_codes.yaml
    # format_label — the FRIENDLY format wording from display.yaml ("Regular
    # Tag", "Purple Rat Tail"). Deliberately NOT offered: filenames carry the
    # format LETTER (the `format` header token below — A, B, W, X, 1, 7), which
    # is what the shipped presets use and what the downstream naming convention
    # expects. A label also drags spaces into a filename, which then have to be
    # sanitised to underscores, making the name longer and harder to parse.
    #
    # Uncomment to offer it again. Nothing else needs changing: the token still
    # RESOLVES if an existing saved preset names it, so removing it from the
    # palette cannot turn a preset's segment blank (the D43 failure, where a
    # preset referenced a token the palette never had and its segment silently
    # came out empty).
    # - format_label
    - region         # region label from regions.yaml, keyed off `zone` (e.g. Reg2)
    - layout         # CartonLabel / DistLabels / Preticket / StyleHeader
    - key            # the layout's unique key value (keytrol / po / picklist_id)
    # `sl` vs `seq`: both count 1, 2, 3 and both RESTART PER FOLDER. They differ
    # only in width. `seq` is fixed at four digits (0001) and is what Volume
    # Generate stamps on the files it creates. `sl` is padded to the width of
    # the batch being renamed — 7 files give 01..07, 150 give 001..150 — so a
    # name is never longer than it needs to be and never sorts 1, 10, 11, 2 in
    # Explorer. Use `sl` for renaming; `seq` is kept so existing presets and
    # generated names are untouched.
    - seq            # running counter 0001, 0002, ...
    - orig           # the file's current name (handy for second-pass renames)

  # ---- header fields (raw values; union across all layouts) ----
  header_fields:
    # ---- Calgary JSON (json_mode) header fields ----
    # The Calgary layouts spell these out where the .OK layouts abbreviate, so
    # both spellings are offered and each resolves on its own engine.
    - department          # .OK calls it `dept`
    - headerSuffix        # .OK calls it `suffix`
    - compareAtPrice      # .OK calls it `comp_price`
    - compareAtUp         # .OK calls it `comp_up`
    - retailPrice         # .OK calls it `ret_price`
    - purchaseOrderNumber # .OK calls it `po`
    - headerASNid         # the WMS key (and what decides SCAN vs WMS, D38)
    - pickListId
    - pickListSequence
    - packId
    - chain
    - format
    - indicator
    - keytrol
    - po
    - picklist_pre
    - picklist_id
    - picklist_seq
    - suffix
    - hsuffix
    - seq_code
    - pack_id
    - dept
    - category
    - style
    - type
    - psi
    - date
    - time
    - distro_date
    - ad_date
    - ladder_mmdd
    - num_packs
    - num_stores
    - store_lines
    - t_lines
    - line_count
    - block_num
    - num_block
    - lane_rec
    - size_rec
    - pieces
    - packsize
    - pack_type
    - distro_type
    - aisle
    - slot
    - tier
    - locator
    - area
    - house
    - housenum
    - coord
    - nested
    - partial
    - suppress
    - markdown
    - add
    - version
    - instructions
    - vendor_style   # Preticket detail: vendor style (8 chars, free-text)
    - desc
    - price
    - ret_price
    - comp_price
    - comp_up
    - tot_qty
    - tot_ret
    - message1
    - message2
    - item
    - fact1
    - fact2
    - fact3
    # ---- EU/EWMS (EUPreticket) fields ----
    - zone           # header zone (e.g. '10')
    - page           # detail: page number
    - line           # detail: line number
    - size           # detail: size code (e.g. 'XL')
    - qty            # detail: quantity
    - ladder         # detail: ladder
    # ---- EU/EWMS GTA (EUStyleHeader / EUCartonLabel) fields ----
    - process             # header: D/H format-code field (renamed from `format`)
    - distribution_type   # header: distribution type (e.g. 'RG', 'AD')
    - pack_type           # header: pack type ('CL'/'C'/'MP') — note: shared name above
    - description         # header: item description
    - distro_date         # header: distro date
    - quantity            # header: quantity
    - c_distro            # header: C:… distro id
    - universal_item      # header: universal item
    - wave                # header: wave
    - header_asn_id       # header: ASN id
    - carton_nbr          # header: carton number
    - store               # detail: store / DC number
    - size_code           # detail: size code
    - ad_date             # detail: ad date (shared name above)
    - message_code_1      # detail: message code 1
    - message_code_2      # detail: message code 2
    - zone_retail         # detail: zone retail price
    - zone_compare_at     # detail: zone compare-at price
    # NOTE: EUCartonLabel `format` is a DERIVED token (config/derived_fields.yaml),
    # computed from distribution_type + pack_type — offered via the `format` token.

# Display-label config: show coded field values as friendly strings.
#
# Each rule maps a field's raw codes to labels. A rule applies to a file when
# its `match` criteria fit. Omit a criterion (or set it to "*") to match any
# value. When several rules match the same field, the MOST SPECIFIC one wins
# (the one matching the most of chain/layout/format/section).
#
# match keys:
#   chain   2-char chain code ("01".."06"), a LIST like ["03","04"], or "*"  (any)
#   layout  layout name (CartonLabel | DistLabels | Preticket | StyleHeader),
#           a LIST like [StyleHeader, Preticket], or "*"
#   format  the `format` field value (e.g. A, B, L, 1, 7), a LIST, or "*"
#   section section name (Header | Details | Stores …), a LIST, or "*" —
#           needed when one field NAME means different things in different
#           sections of a layout (Calgary JSON `type`: the document kind on
#           the Header, a coded 1-9 type on each detail row)
#   field   REQUIRED — the output_field_name this rule applies to
#
# Any of chain/layout/format may be a LIST to match several values at once
# (OR). A list still counts as "specific" for tie-breaking, same as a single
# value.
#
# values: { raw_code: "Label shown to user", ... }
#
# Notes:
#   - The `chain` field itself is labeled from chains.yaml; you don't need a
#     rule for it here (but one here would override).
#   - In the editor, a field that has a values map is shown as a dropdown of
#     these labels; saving writes the underlying code at the fixed position.
rules:
  # ---- generic (any chain/layout/format) ----
  - match: {field: indicator}
    values: {Y: "Yes", N: "No"}

  - match: {field: psi}
    values: {Y: "Yes", N: "No"}

  - match: {field: prflag}
    values: {Y: "Yes", N: "No"}

  - match: {field: comp_up}
    values: {Y: "Yes", N: "No"}

  # ---- examples of chain/layout/format-specific overrides ----
  # Replace/extend these with your real meanings. Each block below shows a
  # different matching pattern so you can copy whichever you need.


  # (4) Other coded fields (not just `format`).
  - match: {field: type}
    values:
      "1": "Type 1"
      "2": "Type 2"
      "3": "Type 3"
      "4": "Type 4"
      "5": "Type 5"
      "6": "Type 6"
      "7": "Type 7"
      "8": "Type 8"
      "9": "Type 9"

  # ---- Calgary JSON: the document `type` (top of the file) ----
  #
  # Calgary JSON has TWO UNRELATED fields called `type`:
  #   * HEADER  — the document kind, e.g. "styleHeaders"  (these rules)
  #   * DETAIL  — a coded 1-9 type like the other layouts (the generic rule
  #               above, which is correct for it)
  # So these MUST stay scoped to `section: Header`. Without the section they
  # would relabel every detail row too; without them at all, the generic
  # `field: type` rule offers a nonsense "Type 1..9" list for the document kind.
  #
  # The values below are IDENTITY mappings — each code maps to itself, so the
  # editor shows exactly what the vendor sent ("styleHeaders", not a prettified
  # "Style Header"). They exist to claim the field from the generic rule, not to
  # rename anything.
  #
  # NOTE: labels are DISPLAY-ONLY — the file always keeps the raw code.
  #
  # `type` IS the detection signature (`data.type` decides the layout), and it
  # is editable — but only in its CAPITALISATION. Detection lower-cases before
  # matching, so `STYLEHEADERS` is the same document type as `styleHeaders`.
  # `service._assert_layout_stable` refuses anything that does not resolve back
  # to this same layout: an unknown word (the file would not open at all) and a
  # CROSS-TYPE change alike, since the rest of the document keeps its shape.
  #
  # TO ADD A VARIATION: if the vendor starts sending another document kind, add
  # it under the right layout below, mapping the code to itself:
  #     styleHeaders: "styleHeaders"
  #     styleHeadersV2: "styleHeadersV2"      # <- new variation
  # A code that is NOT listed still displays as-is; it just won't be offered as
  # a known value. A NEW document kind also needs a detection rule and a layout
  # spec before OkGen can open it — this file alone is not enough for that.
  # ONE word per layout: a document's type may be re-cased but never changed to
  # another layout's. `_assert_layout_stable` enforces that on every write path
  # — the list here is what the editor offers, not what makes it safe.
  - match: {layout: CalgaryStyleHeader, section: Header, field: type}
    values:
      styleHeaders: "styleHeaders"
  - match: {layout: CalgaryCartonLabel, section: Header, field: type}
    values:
      cartonLabels: "cartonLabels"
  - match: {layout: CalgaryDistLabel, section: Header, field: type}
    values:
      distributionLabels: "distributionLabels"
  - match: {layout: CalgaryPreticket, section: Header, field: type}
    values:
      preTickets: "preTickets"

  # ---- Calgary JSON: chain by CODE or by NAME ----
  #
  # D41 established that the real samples carry the chain BOTH ways — `04`/`06`
  # on style headers and dist labels, `Winners`/`HomeSense` on carton labels. So
  # both forms are offered, in any capitalisation the user types.
  #
  # Scoped to the Calgary layouts: the .OK layouts fall through to the default
  # chain registry (codes only), which is what their fixed-width 2-char field
  # holds. Isolation still applies — `Config.can_change_chain` resolves a NAME
  # to its code before comparing groups, so Europe is filtered out of this list
  # on an NA file and refused on save. (It did not, until this was written:
  # `05` was correctly refused while `Europe` was accepted.)
  - match:
      layout: [CalgaryStyleHeader, CalgaryCartonLabel, CalgaryDistLabel, CalgaryPreticket]
      section: Header
      field: chain
    values:
      "01": "TJMAXX"
      "02": "Marshalls"
      "03": "Homegoods"
      "04": "Winners"
      "05": "Europe"
      "06": "HomeSense"
      "TJMAXX": "TJMAXX"
      "Marshalls": "Marshalls"
      "Homegoods": "Homegoods"
      "Winners": "Winners"
      "Europe": "Europe"
      "HomeSense": "HomeSense"

  # ---- Calgary JSON: the compare-at-up flag ----
  #
  # Every key here is QUOTED deliberately: YAML 1.1 reads bare true/false/Yes/
  # No/Y/N — and TRUE/FALSE/YES/NO/y/n — as BOOLEANS, so unquoted they would
  # load as Python True/False and the option list would come out as "True"/
  # "False", not what the file holds. Quoting is why 12 near-identical-looking
  # entries can coexist at all: unquoted, six of them would collapse onto two.
  # Blank is a real, allowed value (it is not "false"), so it is offered first.
  #
  # Every casing the documents use is listed rather than a canonical few: the
  # field accepts any of them, so a list that offered only some would make the
  # rest unreachable from the editor — the `type` dropdown problem (D56), where
  # a correct value could not be selected. Ordered blank, then upper, then
  # lower, so the list scans instead of alternating case.
  #
  # `FALSE` is 5 characters and the field holds 5, so every entry fits: a
  # dropdown offering a value too long to SAVE is the D48 defect.
  - match:
      layout: [CalgaryStyleHeader, CalgaryPreticket]
      section: Details
      field: compareAtUp
    values:
      "": "(blank)"
      "TRUE": "TRUE"
      "FALSE": "FALSE"
      "YES": "YES"
      "NO": "NO"
      "Y": "Y"
      "N": "N"
      "true": "true"
      "false": "false"
      "yes": "yes"
      "no": "no"
      "y": "y"
      "n": "n"

  # ---- Calgary JSON: the past-season indicator ----
  #
  # BLANK IS A REAL VALUE and is offered first (the user's explicit call): the
  # vendor sample carries `N`, but a space is equally legitimate and a list
  # that omitted it would make blank unreachable from the editor — the D56
  # defect, where a correct value could not be selected.
  #
  # Scoped to CalgaryPreticket only. The Style Header has never had a
  # pastSeasonIndicator dropdown and gains nothing here, so adding this to it
  # would change an existing layout's editor on the way past. Add the name to
  # the list if that turns out to be wanted.
  - match:
      layout: CalgaryPreticket
      section: Details
      field: pastSeasonIndicator
    values:
      "": "(blank)"
      "Y": "Yes"
      "N": "No"

  - match: {layout: StyleHeader, field: indicator}
    values:
      N: "StyleHeader"
      Y: "Preticket"


  # (7) LISTS — one rule covering several chains AND several layouts at once.
  # TJMAXX formats
  - match:
      chain: ["01"]
      layout: [StyleHeader, Preticket, CalgaryStyleHeader, CalgaryPreticket]
      field: format
    values:
      A: "Purple Tag"
      B: "Regular Gum Label"
      C: "Coordinate Tag"
      D: "Coordinate Gum Label"
      F: "Shoe Gum Label"
      G: "Giftware Gum Label"
      H: "Piggy Back Gum Label"
      I: "Q-Line Large Gum Label"
      J: "Rat Tail Gum Label"
      K: "Two Part Tag"
      M: "EAS Tag"
      N: "Large Dura Tag"
      O: "Small Tag"
      P: "Mini Gum"
      S: "Dumbbell Gum Label"
      T: "Q-line Small Gum Label"
      U: "Trophy Tag"
      Y: "Small DuraTag"

  # (7) LISTS — one rule covering several chains AND several layouts at once.
  # Marshalls formats
  - match:
      chain: ["02"]
      layout: [StyleHeader, Preticket, CalgaryStyleHeader, CalgaryPreticket]
      field: format
    values:
      A: "Purple Tag"
      B: "Regular Gum Label"
      C: "Coordinate Tag"
      D: "Pink Coordinate Gum"
      E: "Shoe Tag"
      F: "Shoe Gum Label"
      G: "Giftware Gum Label"
      H: "Piggy Back Gum Label"
      I: "Mini Gum"
      J: "Rat Tail Gum Label"
      K: "Two Part Tag"
      L: "Q-line Large Gum Label"
      M: "EAS Tag"
      N: "Large Dura Tag"
      O: "Small Tag"
      P: "Small Gum Label"
      S: "Dumbbell Gum Label"
      T: "Q-line Small Gum Label"
      U: "Trophy Tag"
      Y: "Small DuraTag"

  # Homegoods formats.
  #
  # SPLIT BY LAYOUT: `Q` and `X` are Style-Header-only formats (the user's
  # word), so Pre-Ticket must NOT gain them. The anchor is what makes the split
  # cheap — the base list below is the SINGLE source, and the Style Header rule
  # merges it with `<<` and adds its own two. Duplicating the list instead would
  # leave two copies to keep in step, which is the drift D41 set out to avoid.
  # Rules never merge with each other (most-specific-wins, see the header), so
  # the split has to be expressed in the YAML rather than by layering rules.
  - match:
      chain: ["03"]
      layout: [Preticket, CalgaryPreticket]
      field: format
    values: &homegoods_formats
      A: "Regular Tag"
      B: "Regular Gum Label"
      D: "Mini Gum"
      H: "Rem Piggy Back Gum Label"
      J: "Rat Tail Gum Label"
      N: "Dura Tag"
      R: "Permanent Gum Label"
      S: "Lead Content Label"
      U: "Trophy Tag"
      V: "Rug Tag"
      W: "LeadDuraTG"

  # Style Headers — the same list PLUS the Style-Header-only formats. Both
  # engines' style-header layouts are named here, so one entry still serves the
  # `.OK` and the Calgary side at once (D41).
  - match:
      chain: ["03"]
      layout: [StyleHeader, CalgaryStyleHeader]
      field: format
    values:
      <<: *homegoods_formats
      Q: "Two Part Tag"
      X: "Dumbbell Gum Label"

  # Winners and HomeSense formats — split by layout for the same reason as
  # Homegoods above; see that comment for what the anchor is doing.
  - match:
      chain: ["04", "06"]
      layout: [Preticket, CalgaryPreticket]
      field: format
    values: &winners_homesense_formats
      A: "Coordinate Gum Label"
      B: "Blue Gum"
      C: "Coordinate Hard"
      D: "Double Gum"
      E: "Permanent Gum"
      F: "Tough Tag"
      G: "Coordinate Double Gum"
      H: "Irregular Hard"
      I: "Irregular Gum"
      J: "Rat Tail Label"
      L: "Regular Gum"
      M: "Small Hard"
      P: "Pink Tough Rag"
      R: "Generic Rattail"
      S: "Small Gum"
      T: "Regular Hard"
      U: "USA Hard"
      V: "USA Gum"
      Y: "Trophy Tag"
      Z: "Fact Tag"

  # Style Headers — the base list plus the Style-Header-only formats.
  - match:
      chain: ["04", "06"]
      layout: [StyleHeader, CalgaryStyleHeader]
      field: format
    values:
      <<: *winners_homesense_formats
      W: "Purple Tuff Tag"
      X: "Purple Rat Tail"

  # (7) LISTS — one rule covering several chains AND several layouts at once.
  # TJMAXX formats
  - match:
      chain: ["01", "02"]
      layout: [CartonLabel, CalgaryCartonLabel]
      field: format
    values:
      1: "Carton Label"
      2: "Carton Ad Label"
      3: "Carton Coordinate"
      4: "Master Pack Label"
      5: "Master Pack Ad Label"
      6: "Master Pack Coordinate"



  # (7) LISTS — one rule covering several chains AND several layouts at once.
  # TJMAXX formats
  - match:
      chain: ["01", "02"]
      layout: [DistLabels, CalgaryDistLabel]
      field: format
    values:
      7: "Distribution Label"
      9: "Coordinate Dist. Label"



  # (7) LISTS — one rule covering several chains AND several layouts at once.
  # Homegoods formats
  - match:
      chain: ["03"]
      layout: [CartonLabel, CalgaryCartonLabel]
      field: format
    values:
      1: "Carton Label"
      2: "AD Carton Label"
      4: "Masterpack Label"
      5: "AD Masterpack Label"


  # (7) LISTS — one rule covering several chains AND several layouts at once.
  # Homegoods Winners HomeSense formats
  - match:
      chain: ["03", "04", "06"]
      layout: [DistLabels, CalgaryDistLabel]
      field: format
    values:
      7: "Distribution Label"


  # (7) LISTS — one rule covering several chains AND several layouts at once.
  # Winers Homesense formats
  - match:
      chain: ["04", "06"]
      layout: [CartonLabel, CalgaryCartonLabel]
      field: format
    values:
      1: "Carton Label"
      2: "AD Carton Label"
      3: "Coordinate Carton Label"
      4: "Masterpack Label"
      5: "AD Masterpack Label"


  # Europe TJXE GTA — the `process` letter names the layout itself and is shown
  # locked (read-only, see config/field_display.yaml): D = layup style header,
  # H = holdings carton labels.
  - match:
      layout: [EUStyleHeader, EUCartonLabel]
      field: process
    values:
      D: "(D) StyleHeader"
      H: "(H) Holdings/CartonLabels"
      
      
  # Europe TJXE GTA — the ticket-format letter maps to the physical ticket type
  # (editable dropdown; saving writes the underlying code). The FIELD NAME
  # differs by layout on purpose:
  #   EUStyleHeader  -> `format`         (its only format; matches every other
  #                                       layout, and what Run TOSCA resolves)
  #   EUCartonLabel  -> `ticket_format`  (it ALSO has a derived `format` = the
  #                                       carton/masterpack type, a different
  #                                       thing — see derived_fields.yaml)
  - match:
      layout: [EUStyleHeader]
      field: format
    values:
      A: "Standard White Swift"
      B: "Single Gum"
      C: "Beige Coordinate"
      F: "High Adhesive"
      J: "Small Merchandise Ticket"
      L: "Water Soluble"
      O: "Pre-Ticket Tag"
      Q: "Small Merch UPP Ticket"
      R: "Age Restriction"
      U: "Standard UPP"
      X: "Large Overgum"
      Y: "Small Overgum"

  - match:
      layout: [EUCartonLabel]
      field: ticket_format
    values:
      A: "Standard White Swift"
      B: "Single Gum"
      C: "Beige Coordinate"
      F: "High Adhesive"
      J: "Small Merchandise Ticket"
      L: "Water Soluble"
      O: "Pre-Ticket Tag"
      Q: "Small Merch UPP Ticket"
      R: "Age Restriction"
      U: "Standard UPP"
      X: "Large Overgum"
      Y: "Small Overgum"

  # (7) LISTS — one rule covering several chains AND several layouts at once.
  # Europe TJXE formats
  - match:
      chain: ["05"]
      layout: [EUPreticket]
      field: format
    values:
      A: "Standard White Swift"
      B: "Single Gum"
      C: "Beige Coordinate"
      F: "High Adhesive"
      J: "Small Merchandise Ticket"
      L: "Water Soluble"
      Q: "Small Merch UPP Ticket"
      R: "Age Restriction"
      U: "Standard UPP"

    data_sheet: "Laser-SH_PT_CL_DL_Formats"
    bat: D:\ToscaAutomation\Functional_Testing_Automation\FUN_SH_PT_CL_DL_OnlineLaser_PP\FUN_LASER_ExecutionScript.bat
    input_folders:
      - D:\ToscaAutomation\Functional_Testing_Automation\FUN_SH_PT_CL_DL_OnlineLaser_PP\FUN_LASER_OK_Files

  - name: "OK Functional Thermal"
    applies_to: [ok]
    workbook: D:\ToscaAutomation\Functional_Testing_Automation\FUN_SH_PT_CL_DL_OnlineThermal_PP\FUN_THERMAL_TestData.xlsm

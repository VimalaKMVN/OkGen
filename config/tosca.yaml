# Run TOSCA Script — populate a TOSCA input workbook from selected JSON files.
#
# OkGen writes ONE row per UNIQUE (Chain, Process, Format) taken from the
# selected files into the chosen workbook's data sheet, CONTIGUOUS from the top,
# and clears everything below (TOSCA stops at the first blank row, so this makes
# it process exactly the selected set). Macros, dropdowns and helper columns are
# preserved (targeted cell write, no openpyxl round-trip). JSON layouts only.
#
# NOTE: the mappings below (especially `format_columns`) are a best-guess from
# the Key sheet's column names — edit this file to correct them; nothing here is
# baked into code, and a reload picks up changes.

# Each entry is a selectable "script". `workbook` and `bat` may be either a FULL
# FILE PATH or a FOLDER that contains exactly one .xlsm / one .bat (OkGen finds
# it). Paths may be absolute or relative to THIS config directory.
scripts:
  - name: "Laser Compare"
    workbook: "CHANGE_ME/laser_input_folder"   # folder with one .xlsm (or a full .xlsm path)
    data_sheet: "Laser-SH_PT_CL_DL_Formats"
    bat: "CHANGE_ME/laser_run_folder"          # folder with one .bat (its folder = cwd)
  - name: "Thermal"
    workbook: "CHANGE_ME/thermal_input_folder"
    data_sheet: "REG_JSON_THERMAL_Compare"
    bat: "CHANGE_ME/thermal_run_folder"

# After updating the input sheet, OkGen fires the selected script's .bat and
# returns immediately (fire-and-forget; TOSCA does its own reporting). Shown in
# the confirmation before it runs (edit freely):
run_warning: "Make sure the CORRECT PowerForms link is set in the input sheet before running TOSCA."

# Data-sheet layout: 1-based first data row + the column letter of each field.
first_data_row: 2
columns:
  chain: A
  process: B
  format: C
  status: D
  source: E
  date: F

# Constant values written to every row (override if TOSCA expects different).
defaults:
  status: "Work Pending"
  source: "Online"

# ProcessedDate = today, DATE ONLY. Europe chains use D/M/Y; everyone else M/D/Y.
date_format_default: "%m/%d/%Y"
date_format_europe: "%d/%m/%Y"
europe_chain_names: ["TJX Europe"]

# OkGen chain CODE -> the exact TOSCA brand name (Key!Chain_Data spelling).
chain_names:
  "01": "T.J. Maxx"
  "02": "Marshalls"
  "03": "Homegoods"
  "04": "Winners"
  "05": "TJX Europe"
  "06": "HomeSense"

# OkGen JSON layout -> the exact TOSCA process name (Key!Process_Data spelling).
process_names:
  CalgaryStyleHeader: "Style Header"
  CalgaryCartonLabel: "Carton Label"
  CalgaryDistLabel: "Distribution Label"

# The Format "code - description" string comes from the workbook's own Key sheet
# (so it always matches what the dropdown offers). For a given (chain, process),
# pick the Key COLUMN below; the row in that column whose value starts with the
# file's format code is the exact string written. Unmapped combos are reported
# as an error rather than guessed.  <-- BEST GUESS, correct as needed.
key_sheet: "Key"
format_columns:
  "T.J. Maxx":  { "Style Header": C, "Carton Label": I, "Distribution Label": J }
  "Marshalls":  { "Style Header": D, "Carton Label": I, "Distribution Label": J }
  "Homegoods":  { "Style Header": E, "Carton Label": K, "Distribution Label": L }
  "Winners":    { "Style Header": F, "Distribution Label": L }
  "HomeSense":  { "Style Header": F, "Distribution Label": L }
  "TJX Europe": { "Style Header": G }

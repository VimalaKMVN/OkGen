  # ---------------------------------------------------- Manual Orders ----
  # A DIFFERENT KIND of script (`kind: manual_orders`): one header record per
  # selected Style Header / Pre-Ticket file, each with its own
  # ManualOrder_Detail_N tab — see the `manual_orders:` block at the end of
  # this file for the column mapping. Takes .OK AND JSON, any chain.
  #   input_folder  ONE flat folder (not a {chain}\{process}\{format} tree):
  #                 created if missing, EVERY file in it deleted, then the
  #                 selected files copied in — on every run.
  # The .bat is NOT started straight away: the workbook is written, the user
  # can review it, and the run window's "Run TOSCA" button starts it.
  - name: "Manual Orders WorkPending"
    kind: manual_orders
    applies_to: [ok, json]
    workbook: D:\ToscaAutomation\Functional_Testing_Automation\FUN_EU_SH_PT_ManualOrders_WorkPending\FUN_EU_SH_PT_ManualOrders_WP_TestData.xlsm
    bat: D:\ToscaAutomation\Functional_Testing_Automation\FUN_EU_SH_PT_ManualOrders_WorkPending\MO_WP_Automation_RunScript.bat
    input_folder: D:\ToscaAutomation\Functional_Testing_Automation\FUN_EU_SH_PT_ManualOrders_WorkPending\Manual_WorkPending_OkGen_Selected_Input_Files

# A TOSCA run stopped part-way leaves the input workbook OPEN in Excel, and that
# lock outlives the run — so the next attempt fails with "locked". With this on,
# OkGen asks Excel to close THAT ONE workbook and tries again.
#
# It never kills Excel (that would take down your other open workbooks), and it
# never closes a workbook with UNSAVED CHANGES — if you have just set the
# PowerForms link by hand, OkGen tells you instead of discarding it.
# Windows only; ignored elsewhere.
close_open_workbook: true

# After updating the input sheet, OkGen fires the selected script's .bat and
# returns immediately (fire-and-forget; TOSCA does its own reporting). Shown in
# the confirmation before it runs (edit freely):
run_warning: "Make sure the CORRECT PowerForms link is set in the input sheet before running TOSCA."

# ===========================================================================
#  INPUT FILE STAGING — putting the selected files where TOSCA reads them
#  ---------------------------------------------------------------------------
#  Updating the sheet only tells TOSCA WHICH combinations to process; it reads
#  the actual files from a folder tree of its own. So a run is three ordered
#  steps, not two:
#
#      1. update the input workbook's data sheet
#      2. clear + re-fill the input folder for each row written        <-- this
#      3. fire the .bat
#
#  Step 3 runs only if step 2 succeeded for every row. A .bat fired over stale
#  input is worse than a run that did not start, because it reports success.
#
#  THE FOLDER IS THE ROW. Each row is a unique (Chain, Process, Format), and
#  those are the same three values TOSCA substitutes as {B[Chain]}\{B[Process]}\
#  {B[Format]} — so nothing new is resolved here, and files sharing a row share
#  a folder. A file that could not be resolved into a row (no Key match, no
#  chain name) is already reported as an error and is copied nowhere.
# ===========================================================================
input_staging:

  # Master switch. Off = today's behaviour exactly: sheet + .bat, no file copy.
  enabled: true

  # The tree BELOW a script's `input_folders:` root. Tokens are the row's own
  # values: {chain} {process} {format}. Single-quoted so YAML leaves the
  # backslashes alone (see the QUOTING note at the top of this file) — a plain
  # scalar cannot be used here because a leading '{' starts a YAML flow mapping.
  subpath: '{chain}\{process}\{format}'

  # Find the FORMAT folder by its CODE as well as by its full name.
  #
  # This exists to DETECT a disagreement, not to paper over one. The folder
  # names and the Key sheet do not always agree: on T.J. Maxx / Style Header the
  # Key sheet holds 'T-Q-Line Small Gum Label' while the folder is
  # 'T - Q-Line Small Gum Label' (17 of the 18 match exactly; that one does
  # not). Marshalls / 'J- Rat Tail Gum Label' is the same.
  #
  # When the code matches but the NAME does not, that combination is REPORTED
  # and its row is left out of the run — it cannot work: TOSCA builds its input
  # path from the Format CELL, so it would look for the Key sheet's spelling,
  # which is not what the folder is called. Staging files into the correctly
  # named folder would not help; the fix is the Key sheet. Every other selected
  # combination still runs.
  #
  # false = look for an exactly-named folder only (a mismatch then reports as a
  # missing folder, which says less about what is wrong).
  match_format_by_code: true

  # What is removed from a leaf folder before the new files are copied in.
  #   matching  files whose extension matches the script's engine (.OK / .json)
  #   all       every FILE in the folder (still never a subfolder)
  #   none      copy in without clearing
  # Only the leaf folders THIS run populates are touched — never the root, and
  # never a format folder this run is not writing to. Stale files elsewhere are
  # harmless: the data sheet is cleared below the last row, so TOSCA processes
  # only the combinations just written.
  clear: matching

  # A leaf folder that is not there is REPORTED, and that combination is left
  # out of the run — OkGen does not create it (user's call). The rest of the
  # selection runs normally, so ten selected formats with one bad folder run
  # nine and tell you about the tenth.
  #
  # Creating it was considered and rejected: a folder OkGen invents is empty of
  # everything except what this run puts in it, and the usual reason one is
  # missing is that the Key sheet and the tree disagree — in which case a new
  # folder cements the disagreement instead of surfacing it.
  #
  # true = create a missing leaf folder (named exactly as the sheet cell) and
  # stage into it.
  create_missing: false

  # Copy, never move: the selected files stay where the user has them.
  # An existing file of the same name in the target is overwritten.
  overwrite: true

# Data-sheet layout: 1-based first data row + the column letter of each field.
first_data_row: 2
columns:
  chain: A
  process: B
  format: C
  status: D
  source: E
  date: F

# Constant values written to every row (override if TOSCA expects different).
defaults:
  status: "Work Pending"
  source: "Online"

# ProcessedDate = today, DATE ONLY. Europe chains use D/M/Y; everyone else M/D/Y.
date_format_default: "%m/%d/%Y"
date_format_europe: "%d/%m/%Y"
europe_chain_names: ["TJX Europe"]

# OkGen chain CODE -> the exact TOSCA brand name (Key!Chain_Data spelling).
chain_names:
  "01": "T.J. Maxx"
  "02": "Marshalls"
  "03": "Homegoods"
  "04": "Winners"
  "05": "TJX Europe"
  "06": "HomeSense"

# OkGen layout -> the exact TOSCA process name (Key!Process_Data spelling:
# "Pre-Ticket" / "Style Header" / "Carton Label" / "Distribution Label").
# BOTH engines map here. A .OK file and the JSON for the same Chain/Process/
# Format deliberately resolve to the SAME row — rows are deduped by that triple,
# so a mixed selection writes one row, not two.
process_names:
  # Calgary JSON layouts
  CalgaryStyleHeader: "Style Header"
  CalgaryCartonLabel: "Carton Label"
  CalgaryDistLabel: "Distribution Label"
  # A JSON Pre-Ticket resolves to the SAME process name as the .OK one, which is
  # the whole mechanism: `format_columns` below already maps "Pre-Ticket" for
  # every NA chain, the shipped JSON scripts are the `…_SH_PT_CL_DL_…` ones that
  # already accept Pre-Tickets, and input staging addresses folders by
  # {chain}\{process}\{format}. So this single line is the entire TOSCA change.
  CalgaryPreticket: "Pre-Ticket"
  # Line-based .OK layouts
  StyleHeader: "Style Header"
  Preticket: "Pre-Ticket"
  CartonLabel: "Carton Label"
  DistLabels: "Distribution Label"
  EUPreticket: "Pre-Ticket"
  EUStyleHeader: "Style Header"
  EUCartonLabel: "Carton Label"
  # NB the EU GTA `process` field (D/H) is the LAYOUT discriminator, NOT a ticket
  # format, and is deliberately never used as one: 'H' is a real format code
  # elsewhere ('H - Piggy Back Gum Label'), so a fallback could match a wrong row.

# The Format "code - description" string comes from the workbook's own Key sheet
# (so it always matches what the dropdown offers). For a given (chain, process),
# pick the Key COLUMN below; the row in that column whose value starts with the
# file's format code is the exact string written. Unmapped combos are reported
# as an error rather than guessed.
# Key columns, by their own header names (identical across all ten workbooks):
#   C TJMaxx_SH_PT_Format   D Marshalls_SH_PT_Format  E Homegoods_SH_PT_Format
#   F Winners_HS_SH_PT_Fmt  G Europe_SH_Format        H Europe_PT_Format
#   I TJ_MAR_CL_Fmt         J TJ_MAR_DL_Fmt           K HG_CL_Fmt
#   L HG_WN_HS_DL_Fmt       M Winners_HS_CL_Fmt       N Europe_CL_Fmt
# Note the *_SH_PT_* columns serve Style Header AND Pre-Ticket both.
# Where the run log goes. EVERY run writes one — a run that staged nothing is
# itself an answer, and by the time you want to know, the result window is gone.
#
# Blank (or absent) means the `logs` folder beside OkGen, next to the
# okgen_send_*, okgen_total_qty_* and okgen_folder_dialog_* files already there.
# The file is `okgen_tosca_<YYYYMMDD_HHMMSS>.log` and holds exactly the text the
# "View report" button shows — one build_report() feeds both, so what you paste
# into a message cannot differ from what the log says.
#
# A log that cannot be written never fails the run: the report still reaches the
# window, and the "Also written to" line is simply omitted.
#
# NOT a backslash-escaping trap like the paths above — but the same rule applies,
# so write it unquoted:  log_folder: D:\ToscaAutomation\OkGenLogs
log_folder:

key_sheet: "Key"
format_columns:
  "T.J. Maxx":  { "Style Header": C, "Pre-Ticket": C, "Carton Label": I, "Distribution Label": J }
  "Marshalls":  { "Style Header": D, "Pre-Ticket": D, "Carton Label": I, "Distribution Label": J }
  "Homegoods":  { "Style Header": E, "Pre-Ticket": E, "Carton Label": K, "Distribution Label": L }
  "Winners":    { "Style Header": F, "Pre-Ticket": F, "Carton Label": M, "Distribution Label": L }
  "HomeSense":  { "Style Header": F, "Pre-Ticket": F, "Carton Label": M, "Distribution Label": L }
  "TJX Europe": { "Style Header": G, "Pre-Ticket": H, "Carton Label": N }

# ===========================================================================
#  MANUAL ORDERS — the column mapping for scripts with `kind: manual_orders`
# ===========================================================================
# Columns are named by their HEADER TEXT in row 1, never by letter: TOSCA reads
# these sheets by column name, so a column that moves still lines up. A name
# listed here that the sheet does not have stops the run with a clear message.
#
# Every detail tab is REBUILT from `template_sheet`, so all of them carry its
# column names in its order (the shipped sample's tabs disagreed — some say
# `French Desc`, some `FrenchDesc`, in a different order — Detail_1 is the
# user's choice of which is right).
#
# Where a value comes from — first match wins, in this order:
#   1. the detail LINE   (for the header tab: the file's FIRST detail line)
#   2. the file's HEADER
#   3. the workbook's own SAMPLE value (same row if it has one, else row 2)
# A column NOT listed below always keeps its sample value.
#
# A column's source is one of:
#   "=text"            this exact text, always
#   "@chain" / "@process" / "@format" / "@key"
#                      resolved the same way as the other TOSCA scripts (chain
#                      and process names, the Key-sheet format string) and as
#                      Make Unique (the key — keys.yaml; a Calgary JSON Style
#                      Header is keytrol for SCAN, headerASNid for WMS)
#   [names]            field names, across BOTH engines — a file simply lacks
#                      the ones that are not its own
#   {from: [names], as: price|yn|number|mmdd}
#                      price  000799999 -> 7999.99   (cents -> dollars)
#                      yn     true/false -> Y/N
#                      number 00002 -> 2              (leading zeros dropped)
#                      mmdd   20260301 -> 0301        (a JSON ladderPlan date)
manual_orders:
  header_sheet: "ManualOrder_Header"
  detail_sheet: "ManualOrder_Detail_{n}"      # {n} = the record number, 1..N
  template_sheet: "ManualOrder_Detail_1"
  first_data_row: 2
  processes: ["Style Header", "Pre-Ticket"]   # Carton/Dist Labels are skipped

  # The sections holding a file's detail LINES, per layout. The first one with
  # rows gives one line per row; a later one contributes its FIRST row beneath
  # (a Calgary Style Header has N sizes and one details row of prices).
  lines:
    StyleHeader: [Size]
    Preticket: [Lane]
    EUStyleHeader: [Detail]
    EUPreticket: [Lane]
    CalgaryStyleHeader: [Sizes, Details]
    CalgaryPreticket: [Details]

  # Header fields that must NEVER be used as a fallback. A Calgary header's
  # `type` is the document discriminator, not the ticket type (same name,
  # different field).
  never_from_header:
    CalgaryStyleHeader: [type, timestamp]
    CalgaryPreticket: [type, timestamp]

  # EU Style Header zone, per detail line, from the CBC = first 3 digits of the
  # line's store (config/cbc_zones.yaml).
  cbc_zone:
    layouts: [EUStyleHeader]
    field: store
    digits: 3

  header_columns:
    HeaderChain: "@chain"
    HeaderProcess: "@process"
    HeaderFormat: "@format"
    Status: "=Work Pending"
    Source: "=Manual"
    HeaderPastSeason: [psi, past_yn, pastSeasonIndicator]
    KeyValue: "@key"
    OTT: [orig_ticket_type]
    HeaderASNID: [header_asn_id, headerASNid]
    Zone: [zone]                 # EU Pre-Ticket header zone / EU SH line CBC zone

  detail_columns:
    Department: [dept, department]
    Category: [category]
    Style: [style]
    Type: [type]
    Message1: [message1, message_code_1, messageCode1]
    Message2: [message2, message_code_2, messageCode2]
    Size: [size, size_code]
    LadderMM: [ladder]           # holding period in months (.OK only)
    LadderMMDD: {from: [ladder_mmdd, ladderPlan], as: mmdd}
    ComparePrice: {from: [comp_price, zone_compare_at, compareAtPrice], as: price}
    CompareUp: {from: [comp_up, compareAtUp], as: yn}
    RetailPrice: {from: [ret_price, zone_retail, retailPrice, base_orig_retail], as: price}
    Quantity: {from: [qty, quantity], as: number}
    VendorStyle: [vendor_style, ven_style, vendorStyle]
    Item: [item]
    Fiber: [fiber]               # in no layout yet — ready for when one has it
    ApproxSize: [approx_size]    # ditto
    Fact1: [fact1]
    Fact2: [fact2]
    Fact3: [fact3]
    Country: [country]           # ditto
    Page: {from: [page, pageNumber], as: number}
    Line: {from: [line, lineNumber], as: number}
    HouseNumber: [housenum, houseNumber]
    FrenchDesc: [frdesc, frenchDescription]
    FrenchNoun: [frnoun, frenchNoun]
    EnglishDesc: [desc, description]
    EnglishNoun: [engnoun, englishNoun]
    MsgCode1: [message_code_1]
    UPPWeight: [upp_weight_uom]  # the unit (M / G)
    TotalWeight: [upp_weight]    # user: UPP weight IS the total weight
    Zone: [zone]
    # Not listed, so always the sample value: the French/English Fact, Item,
    # Fiber and Country columns (no layout carries them yet), and UPPPrice
    # (computed by the label application from TotalWeight and RetailPrice).

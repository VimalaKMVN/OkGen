  # ---------------------------------------------------------------- JSON ----
  - name: "JSON Functional Laser"
    applies_to: [json]
    workbook: D:\ToscaAutomation\Functional_Testing_Automation\FUN_JSON_SH_PT_CL_DL_OnlineLaser_PP\FUN_JSON_LASER_TestData.xlsm
    data_sheet: "Laser-SH_PT_CL_DL_Formats"

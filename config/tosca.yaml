    bat: D:\ToscaAutomation\Functional_Testing_Automation\FUN_SH_PT_CL_DL_OnlineThermal_PP\FUN_THERMAL_ExecutionScript.bat
    input_folders:
      - D:\ToscaAutomation\Functional_Testing_Automation\FUN_SH_PT_CL_DL_OnlineThermal_PP\FUN_THERMAL_OK_Files

  - name: "OK Delete RP Laser"
    applies_to: [ok]
    workbook: D:\ToscaAutomation\Functional_Testing_Automation\FUN_SH_PT_CL_DL_DeleteOrders_RePrint_PP\FUN_SH_PT_CL_DL_DeleteOrders_RP_PP_TestData.xlsm

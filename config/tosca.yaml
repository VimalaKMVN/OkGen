  - name: "OK Regression Laser"
    applies_to: [ok]
    workbook: D:\ToscaAutomation\Regression_Testing_Automation\REG_LASER_SH_PT_CL_DL_Comparison\REG_LASER_Compare_TestData.xlsm
    data_sheet: "Laser-SH_PT_CL_DL_Formats"
    bat: D:\ToscaAutomation\Regression_Testing_Automation\REG_LASER_SH_PT_CL_DL_Comparison\REG_LASER_ExecutionScript.bat
    input_folders:
      - D:\ToscaAutomation\Regression_Testing_Automation\REG_LASER_SH_PT_CL_DL_Comparison\REG_LASER_OK_Files

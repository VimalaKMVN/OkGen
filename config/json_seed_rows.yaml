# The row OkGen writes when you ADD a row to a JSON section.
#
# A `.OK` layout gets this for free: the compiler lifts a real record line out
# of the reference `.OK` and bakes it into the layout as `sample_raw`, so adding
# a row to an empty `.OK` section produces a realistic, valid row. JSON layouts
# are hand-authored specs with no reference file to learn from, so this file is
# the JSON equivalent of `sample_raw`.
#
# The values below started as the VENDOR SAMPLE ROWS — the user's explicit
# call: a newly added row should look like the rows their real files carry, so
# it is a usable starting point rather than something to fill in from scratch.
# Several sections now carry values the user chose instead (a DistLabel store's
# `store`/`qtyToPrint`, a CartonLabel store's quantities, the StyleHeader
# `lane`/`size`/`quantity`), which is what this file is FOR — it is the one
# place a seed is decided, and no code knows any of these values.
#
# EVERY value is quoted, except a deliberate `null`. YAML 1.1 reads bare
# true/false/Yes/No/Y/N as BOOLEANS, so `compareAtUp: true` would load as Python
# True and be written as the string "True" — a value no Calgary file contains.
#
# `null` here means a real JSON null, NOT an empty string. The samples use both
# and they are different things — D34/D39 exist because "absent" and "empty" are
# not interchangeable downstream. A field OMITTED from a section below falls
# back to "" (see `_json_seed_values`).
#
# A temporal field's seed goes through the same forgiving parser a typed value
# does (D29), so it may be written as an EXACT stamp — which passes through
# byte-for-byte — or as `now`, which is stamped when the row is added. This is
# per FIELD, per LAYOUT and entirely opt-in: an earlier cut stamped `now` into
# ANY temporal field automatically, which was wrong on two of the three layouts
# (CalgaryCartonLabel's sample carries `date: null`, CalgaryStyleHeader's `" "`)
# and was withdrawn. Only what is declared `now` below gets a current stamp.
# `date` stays a declared date field in `date_fields.yaml`, so editing it, its
# validation and Bulk/Generate's random-date range are unaffected either way.
#
# SCOPE: adding rows only — the single-file "+", Bulk Add rows, and Volume
# Generate's row counts. Nothing here is read by `.OK` -> JSON conversion (that
# has its own rule for an empty section) or by deleting/emptying a section
# (see `json_empty_rows.yaml`), and none of it applies to `.OK` layouts.
#
#   layout -> { section -> { field -> seed value } }
seed_rows:
  CalgaryStyleHeader:
    # Lanes and Sizes are confirmed good as they are, so they keep their chosen
    # values rather than the sample row (whose `lane` is blank).
    Lanes:
      lane: ""
    Sizes:
      # `size` is a real null, not "" — the vendor sample carries null and the
      # two are not interchangeable (D34/D39).
      size: null
      quantity: "100"

    # Stores is the sample row VERBATIM, blanks and all. A StyleHeader `.OK` has
    # no store section, and stores are out of scope for Style Headers as a
    # business matter, so there is nothing here to make "work" — it only has to
    # match the sample, and it does.
    #
    # Consequence, accepted and unreachable in practice: because every field is
    # blank, D52 reads the section as holding no data, so a single add replaces
    # the previous row rather than stacking (bulk add N and Generate n still
    # produce N blank rows). Nobody adds stores to a Style Header.
    Stores:
      store: ""
      puertoRicoFlag: " "
      units: " "
      distroType: " "
      date: " "
      storeQuantity: " "
      cartonSequence: " "
      numberOfPacks: " "
      adDate: " "
      suppress: " "
      qtyToPrint: null
      puertoRicoStoreSeq: null
      puertoRicoStore: null

    Details:
      pageNumber: "001"
      lineNumber: "001"
      style: "275886"
      type: "1"
      pastSeasonIndicator: " "
      messageCode1: "GTA TEST01"
      messageCode2: "GTA TEST02"
      compareAtPrice: "000999999"
      compareAtUp: "true"
      retailPrice: "000799999"
      quantity: "0000020"
      houseNumber: null
      pieces: "00"
      ladderPlanMMYY: "0326"
      ladderPlan: "20260301"
      frenchDescription: null
      englishNoun: ""
      frenchNoun: ""
      category: "6204"
      item: ""
      fact1: ""
      fact2: ""
      fact3: ""

  CalgaryDistLabel:
    Stores:
      store: "0115"
      puertoRicoFlag: null
      units: "20"
      distroType: ""
      # `now` — stamped when the row is added, in this field's declared RFC 3339
      # nanosecond format. An exact stamp may be written here instead and passes
      # through byte-for-byte; both go through the same parser as a typed value.
      date: now
      storeQuantity: "5"
      cartonSequence: null
      numberOfPacks: null
      adDate: ""
      suppress: null
      qtyToPrint: "10"
      puertoRicoStoreSeq: null
      puertoRicoStore: null

  CalgaryCartonLabel:
    Stores:
      store: "0206"
      puertoRicoFlag: "N"
      units: null
      distroType: null
      date: null
      storeQuantity: "7"
      cartonSequence: null
      numberOfPacks: "1"
      adDate: ""
      suppress: "N"
      qtyToPrint: null
      puertoRicoStoreSeq: ""
      puertoRicoStore: null

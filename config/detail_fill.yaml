# Trailing zero-fill for detail sections that pad a fixed block with all-zero
# "filler" rows (Preticket). Whenever a configured section holds >= 1 real
# (non-blank) row, OkGen keeps exactly `zeros` trailing filler rows after the
# real ones and sets the header count field (from section_counts) to the number
# of REAL rows. When the section has no real rows at all, no filler is added.
#
# Filler rows are COPIED — from the file's own existing filler rows when present,
# otherwise from the reference filler learned at compile time (Section.filler_raw)
# — never synthesised, because the zero/space byte layout is not derivable from
# the field spec.
#
#   layout -> { section -> zeros }
fill:
  Preticket:
    Lane: 10
  # EUPreticket has NO filler rows in production — count-only (zeros: 0) means
  # OkGen just keeps line_count in sync with the real detail-row count, without
  # adding or removing any rows.
  EUPreticket:
    Lane: 0

# Layouts whose detail lines carry padding spaces AFTER the record terminator
# ('\') that the format does not need (Preticket writes '...VENDORST\   '). On
# write, OkGen trims that trailing pad so each detail line ends right at the
# terminator. The terminator is a non-space char, so every field — including a
# space-padded trailing field like vendor_style — is preserved; only the junk
# after '\' is removed. Runs on write only (like `fill` above), so a plain open
# still round-trips byte-exact. Header line is never touched.
#
#   layout -> trim trailing pad after the record terminator on detail lines
trim_trailing:
  - Preticket

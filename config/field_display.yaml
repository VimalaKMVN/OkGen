# Per-layout editor-field display rules.
#
#   hidden    field names never shown in the section editor — structural /
#             marker tokens the user doesn't need to see (the leading-'|'
#             placeholder, the '#'/'&' record-type chars). The bytes are still
#             parsed and preserved on save; this only hides them from the form.
#
#   readonly  field names shown but NOT editable — rendered as a static label.
#             A coded value uses its display.yaml label (e.g. format H ->
#             "CartonLabels"), so the user sees the friendly value locked.
#
#   layout name -> [output_field_name, ...]
hidden:
  EUStyleHeader: [marker, detail_marker, lane_marker]
  EUCartonLabel: [marker, detail_marker]

readonly:
  # --- layout DETECTION SIGNATURES — do not unlock ---
  # Each of these fields IS the byte(s) detect.py keys off to identify the file's
  # layout, so editing one makes the saved file unopenable — or worse, silently
  # detect as a DIFFERENT layout (StyleHeader/Preticket 'indicator' -> a digit
  # reads as DistLabels, and every field then parses at the wrong offset).
  # Locking them here also removes them from Bulk Edit. A save-time check
  # (service._assert_layout_stable) backstops this list if it ever drifts.
  StyleHeader: [indicator]      # 'N' at raw pos 4
  Preticket: [indicator]        # 'Y' at raw pos 4
  DistLabels: [format]          # '7'/'9' at raw pos 4
  CartonLabel: [picklist_pre]   # 'C:' at raw pos 5..6
  EUPreticket: [indicator]      # 'P' in the '¦P|' delimited header signature
  EUStyleHeader: [process]      # 'D' at raw pos 2
  EUCartonLabel: [process]      # 'H' at raw pos 2

# Fields the editor must let you TYPE, even though display.yaml gives them a
# value list. A field with options renders as a dropdown, which is right when
# the list is the whole truth — and wrong for `type`, whose list is the ONE word
# this layout's documents carry: the dropdown offered a single choice, so there
# was no way to enter another capitalisation of it. Listed fields render as a
# text box with their known values suggested instead.
#
# This only decides how the field is PRESENTED. What may actually be saved is
# decided on save by `service._assert_layout_stable`, which resolves the value
# back through detection and refuses anything that is not this same layout — a
# re-casing is free, a cross-type change is refused, and an unknown word (which
# would make the file unopenable) is refused too. So adding a field here can
# never widen what a file is allowed to become.
#
#   layout name -> [output_field_name, ...]   ("*" applies to every layout)
# `chain` is here for the same reason as `type`: its list is a set of SUGGESTIONS
# (the codes and the brand names), and the user needs to type any capitalisation
# of a name. Isolation is unaffected — `can_change_chain` resolves whatever is
# typed through `Config.chain()` and still refuses Europe (05) on these
# North-America layouts, by code or by name, in any casing.
freeform:
  CalgaryStyleHeader: [type, chain]
  CalgaryCartonLabel: [type, chain]
  CalgaryDistLabel: [type, chain]

# Fields stored EXACTLY as the user typed them: never zero-padded, never
# re-justified, leading/middle/trailing spaces preserved. Only the leftover
# space at the END is filled (with spaces) — the record must keep its exact
# length or every field after it shifts. The field width is still enforced:
# a value longer than the field is rejected, not truncated.
#
# Why this list: these are free-text fields (messages, facts, descriptions,
# sizes, weights, areas). OkGen otherwise GUESSES the padding style from the
# layout's sample value, which misreads a sample like '01        ' as a
# zero-padded number — typing 'AB' into EUPreticket message1 stored
# '00000000AB'. Codes stay out of this list: `dept` remains zero-padded, so 7
# is still stored as 07.
#
#   "*" applies to every layout; add a layout name for a narrower rule.
literal:
  "*":
    - message1
    - message2
    - instructions
    - fact1
    - fact2
    - fact3
    - item
    - universal_item
    - description
    - area
    - size
    - size_code
    - size_1
    - size_2
    - size_3
    - size_4
    - size_5
    - size_6
    - size_7
    - size_8
    - size_9
    - size_10
    - phys_size_1
    - phys_size_2
    - phys_size_3
    - phys_size_4
    - phys_size_5
    - phys_size_6
    - phys_size_7
    - phys_size_8
    - phys_size_9
    - phys_size_10
    - upp_weight
    - header_asn_id
    # Not present in any current layout, listed so they behave correctly the
    # day they appear (Calgary JSON or a spec revision):
    - total_weight
    - vendor_style
    - fiber
    - approx_size
    - country

# --------------------------------------------------------------------------- #
# pad_zeros — values LEFT-padded with zeros to the field's declared size.
#
# Fixed-width .OK layouts pad by construction: a 4-char field is always 4 chars.
# JSON values are trimmed strings, so a store typed as `202` (or arriving as 3
# digits from an input file) would be stored as `202` and REJECTED downstream,
# which expects `0202`. Applied on every write path — single edit, Bulk Edit
# (set / list / random / unique) and volume generation — so it cannot be
# bypassed by one of them.
#
# A blank value stays blank: padding an empty field to `0000` would invent a
# store number that was never entered.
pad_zeros:
  CalgaryStyleHeader:
    - store
  CalgaryDistLabel:
    - store
  CalgaryCartonLabel:
    - store

# --------------------------------------------------------------------------- #
# blank_allowed — fields a CLEARED editor box actually blanks.
#
# A fixed-width field is written using the justification inferred from its
# SAMPLE value, and a sample like `0000` makes the field right-justified and
# '0'-filled. That is right for a value and wrong for an absence:
#
#     ""   -> "0000"      (you cleared the box; OkGen wrote a number)
#     "  " -> "00  "      (you typed two spaces)
#     "    " -> "    "    (only the field's EXACT width worked)
#
# So the only way to blank one was to type precisely 4 spaces, which nobody
# guesses. A listed field treats an empty or all-space entry as "blank this
# field" — the full width written as spaces, keeping the record's exact length.
#
# A REAL value is unaffected and still zero-pads: `531` -> `0531`.
#
# Deliberately a LIST, not a global rule. Making every zero-padded field behave
# this way is arguably more correct (writing 0000 for an absent value is the
# absent-vs-zero collapse D39 settled from the conversion side), but it would
# change behaviour on every such field across all 12 layouts. These are the two
# the user actually hit; add a name when another one turns up.
#
# Bulk Edit and Volume Generate are NOT affected and need nothing here: they
# already have an explicit quoted-blank token (`' '`), advertised in the panel,
# which writes literal spaces on any field.
#
#   layout name -> [output_field_name, ...]   ("*" would apply to every layout)
blank_allowed:
  CartonLabel:
    - dad_date      # store-row ad date; the header's own `ad_date` samples
                    # spaces and so has always blanked correctly
  DistLabels:
    - ad            # Store-row ad date
